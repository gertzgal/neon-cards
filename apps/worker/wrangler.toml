name = "neon-cards"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "neon-cards"
# Placeholder for local dev. Replace with the id from `wrangler d1 create neon-cards` before deploying.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
