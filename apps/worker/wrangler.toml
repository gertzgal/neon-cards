name = "neon-cards"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "neon-cards"
database_id = "dafeddad-28c4-4a44-b8c5-ae91530aa082"
migrations_dir = "migrations"

# `wrangler preview` does not inherit D1. Bind the same remote database so a preview URL can serve /api.
[previews]

[[previews.d1_databases]]
binding = "DB"
database_name = "neon-cards"
database_id = "dafeddad-28c4-4a44-b8c5-ae91530aa082"
migrations_dir = "migrations"
