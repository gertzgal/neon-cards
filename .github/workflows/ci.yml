name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and API tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright against wrangler dev + local D1
        run: pnpm e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy:
    name: deploy
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      # Prints whether the secret exists, never its value, on every run (PRs included).
      - name: Report CLOUDFLARE_API_TOKEN presence
        run: |
          echo "CLOUDFLARE_API_TOKEN present: $HAS_CLOUDFLARE_TOKEN; deploying: $([ "$HAS_CLOUDFLARE_TOKEN$ON_MAIN" = truetrue ] && echo yes || echo no)" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: env.HAS_CLOUDFLARE_TOKEN == 'true' && env.ON_MAIN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_CLOUDFLARE_TOKEN == 'true' && env.ON_MAIN == 'true'
        uses: pnpm/action-setup@v4
      - if: env.HAS_CLOUDFLARE_TOKEN == 'true' && env.ON_MAIN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HAS_CLOUDFLARE_TOKEN == 'true' && env.ON_MAIN == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CLOUDFLARE_TOKEN == 'true' && env.ON_MAIN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          scripts/deploy.sh
